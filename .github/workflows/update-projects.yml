name: Update projects

# Keeps assets/projects.json in sync with the GitHub profile, so a new
# repository shows up on the site without anyone editing the page.
on:
  schedule:
    - cron: "17 4 * * *"      # every day, 04:17 UTC
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths:
      - "assets/projects-lib.js"
      - "scripts/update-projects.js"
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate assets/projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-projects.js

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/projects.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects.json
          git commit -m "chore: refresh project list from GitHub"
          git push
