<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Ilia Alakov</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0c10; --text:#e8ecf3; --dim:#98a2b3; --accent:#4ade9a; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--text);
    font-family:"Inter",system-ui,sans-serif; text-align:center;
  }
  body::before {
    content:""; position:fixed; inset:0; z-index:-1;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 40%, #000 10%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%, #000 10%, transparent 75%);
  }
  .code { font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--accent); letter-spacing:.1em; }
  h1 { font-size:clamp(56px,14vw,120px); font-weight:800; letter-spacing:-.05em; margin:8px 0 0; }
  p { color:var(--dim); margin:14px 0 30px; }
  a {
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 18px; border-radius:9px;
    background:var(--accent); color:#05140c;
    font-weight:650; text-decoration:none;
  }
  a:hover { filter:brightness(1.08); }
</style>
</head>
<body>
  <div>
    <p class="code">HTTP 404 · NOT FOUND</p>
    <h1>404</h1>
    <p>That page does not exist. The backend is fine, though.</p>
    <a href="/">Back to the homepage</a>
  </div>
</body>
</html>
